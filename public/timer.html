<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        /* Two lines, all text the same size:
             line 1:  Meet name ~ Event 401 Heat 11
             line 2:  Event description
           The black background is exactly as wide as the longer of the two
           lines (capped at the width of the browser source - a very long meet
           name is shortened with ... so "~ Event 401 Heat 11" always shows).
           The Next-race prompt is on tv.html only. */
        html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
        body { font-family: 'Ubuntu', sans-serif; }
        .bar {
            display: block;
            width: fit-content;
            max-width: 100vw;
            background: #000000;
            font-size: 44px;
            line-height: 52px;
        }
        .line {
            display: flex;
            align-items: center;
            height: 52px;
            padding: 0 18px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
        }
        .line .main {
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .heat { color: #FFD700; font-weight: bold; }
        .title { color: #FFFFFF; }
        /* "~ Event 401 Heat 11" never shrinks: a long meet name is what gets cut. */
        .tail { flex: 0 0 auto; white-space: pre; }
    </style>
</head>
<body>
    <div class="bar">
        <div class="line" id="lineA"><span class="main heat" id="meet-name">Meet</span><span class="heat tail" id="event-heat"> ~ Event 0 Heat 0</span></div>
        <div class="line" id="lineB"><span class="main title" id="event-title"></span></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/autoreload.js"></script>
    <script>
        const socket = io();
        watchVersion(socket);

        socket.on('scoreboard', function(data) {
            // Same lines as tv.html (meet ~ event/heat, then the description).
            document.getElementById('meet-name').textContent = data.event_name || 'Meet';
            document.getElementById('event-heat').textContent = ` ~ ${data.event_heat || 'Event 0 Heat 0'}`;
            document.getElementById('event-title').textContent = data.event_title || '';
        });
    </script>
</body>
</html>
